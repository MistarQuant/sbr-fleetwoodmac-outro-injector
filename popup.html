<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 300px; font: 14px system-ui, sans-serif; padding: 14px; margin: 0; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .row input[type=range] { flex: 1; }
  #volLabel { width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
  button { width: 100%; margin-top: 8px; padding: 8px; cursor: pointer; }
  #stop { background: #c0392b; color: #fff; border: 0; border-radius: 6px; }
  #status { margin-top: 12px; font-size: 12px; opacity: .85; min-height: 30px; white-space: pre-wrap; }
  a { font-size: 12px; display: inline-block; margin-top: 10px; }
</style>
</head>
<body>
  <h1>The Chain &mdash; Steel Ball Run outro</h1>

  <label class="row"><input id="auto" type="checkbox"> Play automatically at the outro</label>

  <div class="row">
    <span>Volume</span>
    <input id="volume" type="range" min="0" max="100" step="1">
    <span id="volLabel"></span>
  </div>

  <button id="stop">Stop music</button>
  <button id="play">Play The Chain now (test)</button>

  <div id="status"></div>
  <a href="#" id="options">Custom music &amp; trigger time&hellip;</a>

  <script src="popup.js"></script>
</body>
</html>
